# ================================
# ARCHITECTURE & API CONTRACT
# ================================
# Dos comprobaciones que antes solo existían en revisión:
#
# 1. Contratos de arquitectura (import-linter, ver .importlinter): capas,
#    dominio sin frameworks, sin infraestructura ajena entre módulos.
# 2. Contrato de la API: compara el OpenAPI de la PR con el de la rama base y
#    falla si hay un cambio incompatible (ruta quitada, campo que pasa a ser
#    obligatorio, tipo cambiado...). Es la lección de la v2.8.0: un cambio
#    incompatible deja el frontend en producción roto entre los dos despliegues.
#    Si el cambio es deliberado, poner la etiqueta `api-breaking` a la PR: el
#    check lo sigue enseñando pero deja de fallar, y queda dicho que la release
#    tiene que planificar los dos despliegues seguidos.

name: Architecture & API Contract

on:
  pull_request:
    branches: [main, develop]
    # labeled/unlabeled: poner o quitar `api-breaking` vuelve a evaluar el check
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  architecture:
    name: 🏛️ Architecture Contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install import-linter
        # La versión sale de requirements-dev.txt, para que local y CI no diverjan
        run: pip install "$(grep -E '^import-linter==' requirements-dev.txt)"

      - name: Check architecture contracts
        run: lint-imports

  api_contract:
    name: 📜 API Contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OASDIFF_VERSION: '1.32.1'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Hace falta la rama base para generar su OpenAPI

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Install oasdiff
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP"
          gh release download "v${OASDIFF_VERSION}" -R oasdiff/oasdiff \
            -p "oasdiff_${OASDIFF_VERSION}_linux_amd64.tar.gz" -p checksums.txt
          grep "oasdiff_${OASDIFF_VERSION}_linux_amd64.tar.gz" checksums.txt | sha256sum -c -
          tar xzf "oasdiff_${OASDIFF_VERSION}_linux_amd64.tar.gz" oasdiff
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Generate OpenAPI (this PR and its base)
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          # La app genera su esquema sin base de datos ni secretos: en el CI no hay .env
          GEN='import json; from main import app; json.dump(app.openapi(), open(__import__("sys").argv[1], "w"), sort_keys=True)'
          python -c "$GEN" "$RUNNER_TEMP/revision.json"
          # La base se genera con las dependencias de la PR. Si la base importa un
          # paquete que la PR ha quitado, este paso falla: es un aviso, no un bug.
          git worktree add --detach "$RUNNER_TEMP/base" "origin/${BASE_REF}"
          (cd "$RUNNER_TEMP/base" && python -c "$GEN" "$RUNNER_TEMP/base.json")

      - name: Check for breaking changes
        env:
          ALLOW_BREAKING: ${{ contains(github.event.pull_request.labels.*.name, 'api-breaking') }}
        run: |
          set +e
          oasdiff breaking "$RUNNER_TEMP/base.json" "$RUNNER_TEMP/revision.json" --fail-on ERR > report.txt
          CODE=$?
          set -e
          cat report.txt

          {
            echo "## 📜 API contract"
            echo ""
            if [ "$CODE" -eq 0 ]; then
              echo "✅ No breaking changes against \`${{ github.base_ref }}\`."
            else
              echo "❌ Breaking changes against \`${{ github.base_ref }}\`:"
            fi
            echo ""
            echo '```'
            cat report.txt
            echo '```'
            echo ""
            echo "Changelog (all changes, breaking or not):"
            echo '```'
            oasdiff changelog "$RUNNER_TEMP/base.json" "$RUNNER_TEMP/revision.json" || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$CODE" -ne 0 ]; then
            if [ "$ALLOW_BREAKING" = "true" ]; then
              echo "::warning::Breaking API changes accepted by the 'api-breaking' label. Plan both deploys back to back."
              exit 0
            fi
            echo "::error::Breaking API changes. If deliberate, add the 'api-breaking' label and plan the release (backend first, both deploys back to back)."
            exit 1
          fi
