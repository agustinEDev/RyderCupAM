# ================================
# CI/CD PIPELINE - RYDER CUP AM
# ================================
# Pipeline completo de integración continua y despliegue continuo
# Ejecuta tests, security checks, linting y type checking en paralelo
#
# Jobs (todos en paralelo; el resumen espera al resto):
# 1. Unit Tests - 662 tests (Python 3.11 + 3.12)
# 2. Integration Tests - 72 tests (con PostgreSQL)
# 3. Security Tests - 45+ tests (CSRF, XSS, SQLi, Auth Bypass)
# 4. Security Checks - Bandit, pip-audit, Gitleaks
# 5. Linting - Ruff (linter + formatter, los dos bloquean)
# 6. Type Checking - Mypy
# 7. Build - Docker + Trivy container scan
# 8. Dependency Review - blocks PRs that add a vulnerable dependency
# 9. SBOM Generation - CycloneDX SBOM + dependency graph
# 10. GPG Signature Verification - Validates all commits are signed
# 11. Architecture Contracts - import-linter (.importlinter)
# 12. API Contract - oasdiff contra la rama base (etiqueta api-breaking)
# 13. OWASP Top 10 - Semgrep (owasp-top-ten + python)
# 14. Summary - Reporte final

name: CI/CD Pipeline

# Triggers: Cuándo se ejecuta este workflow
on:
  push:
    # Solo las ramas largas: una rama de trabajo ya se prueba por su pull_request,
    # y con '**' cada commit de una PR corría el pipeline dos veces.
    branches: [main, develop, 'release/**', 'hotfix/**']
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'CHANGELOG.md'
      - 'LICENSE'
  pull_request:
    branches: [main, develop]
    # Sin labeled/unlabeled: Dependabot pone dos etiquetas al abrir, cada una
    # lanzaba el pipeline entero y la concurrencia cancelaba las anteriores; los
    # checks obligatorios cancelados dejaban la PR bloqueada (BE #444). El job
    # del contrato lee `api-breaking` en el momento: tras ponerla, se relanza
    # ese job a mano («Re-run»). Quitarla NO vuelve a poner el contrato en rojo
    # hasta el siguiente push: aceptado (un solo desarrollador, decidido el 30
    # sep 2026). Un workflow que relanzaba solo se descartó en la #445: esperar
    # al pipeline y relanzarlo abría carreras
    types: [opened, synchronize, reopened]
  workflow_dispatch:

# Permissions for security scanning
# Mínimos para todos; el job que sube SARIF (build, Trivy) pide security-events.
permissions:
  contents: read

# Un push nuevo a la misma rama cancela la ejecución anterior, salvo en main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # ================================
  # JOB 2: UNIT TESTS
  # ================================
  # Ejecuta 662+ tests unitarios (sin base de datos)
  # Matriz: Python 3.11 + 3.12
  # Coverage: XML + HTML reports

  unit_tests:
    name: 🧪 Unit ${{ matrix.python-version }}${{ matrix.experimental && ' exp' || '' }}
    runs-on: ubuntu-24.04
    # Columna 2 del gráfico: espera a la de análisis estático (30 sep 2026). Si algo
    # de la columna 1 FALLA, esta se salta: no se gastan minutos de tests en una PR
    # que no se puede mergear. Es seguro porque TODO lo de la columna 1 es check
    # obligatorio en develop y main: un check obligatorio «saltado» cuenta como
    # aprobado en GitHub, pero el fallo de la columna 1 ya bloquea el merge. Lo que
    # solo se salta (API contract o Dependency Review en un push) no cuenta como fallo.
    needs: [linting, type_checking, architecture, api_contract, owasp_semgrep, security_checks, dependency_review, gpg_verification]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') }}
    timeout-minutes: 15
    # 3.13 y 3.14 se prueban sin bloquear (30 sep 2026): antes de pasar la imagen
    # de producción a una versión nueva (Dependabot #423 propone 3.14) hay que
    # saber si el código y las dependencias funcionan. Si falla sale en rojo, pero no impide mergear; los
    # checks obligatorios siguen siendo 3.11 y 3.12.
    continue-on-error: ${{ matrix.experimental == true }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
        include:
          - python-version: '3.13'
            experimental: true
          - python-version: '3.14'
            experimental: true

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Restore pip cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-
            ${{ runner.os }}-pip-

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Unit Tests with Coverage
        run: |
          echo "Running unit tests on Python ${{ matrix.python-version }}..."
          pytest tests/unit/ -v --cov=src --cov-report=xml --cov-report=term-missing --cov-report=html

      - name: Upload Coverage Report (XML)
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report-xml
          path: coverage.xml
          retention-days: 7

      - name: Upload Coverage Report (HTML)
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report-html
          path: htmlcov/
          retention-days: 7

  # ================================
  # JOB 3: INTEGRATION TESTS
  # ================================
  # Ejecuta 72+ tests de integración (con PostgreSQL)
  # Incluye: API, Database, Use Cases

  integration_tests:
    # 3.12 conserva el nombre exacto (es el que miran los checks obligatorios);
    # 3.14 se prueba sin bloquear, en la misma base de datos de servicio, antes
    # de pasar la imagen de producción a esa versión (Dependabot #423).
    name: 🗄️ Integration ${{ matrix.python-version }}${{ matrix.experimental && ' exp' || '' }}
    runs-on: ubuntu-24.04
    # Columna 2 del gráfico: espera a la de análisis estático (30 sep 2026). Si algo
    # de la columna 1 FALLA, esta se salta: no se gastan minutos de tests en una PR
    # que no se puede mergear. Es seguro porque TODO lo de la columna 1 es check
    # obligatorio en develop y main: un check obligatorio «saltado» cuenta como
    # aprobado en GitHub, pero el fallo de la columna 1 ya bloquea el merge. Lo que
    # solo se salta (API contract o Dependency Review en un push) no cuenta como fallo.
    needs: [linting, type_checking, architecture, api_contract, owasp_semgrep, security_checks, dependency_review, gpg_verification]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') }}
    continue-on-error: ${{ matrix.experimental == true }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12']
        include:
          - python-version: '3.14'
            experimental: true
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Restore pip cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements*.txt') }}

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Wait for PostgreSQL
        run: |
          echo "Waiting for PostgreSQL to be fully ready..."
          sleep 5

      - name: Run Database Migrations
        env:
          DATABASE_URL: postgresql+asyncpg://test_user:test_password@localhost:5432/test_db
        run: |
          echo "Running Alembic migrations..."
          alembic upgrade head

      - name: Run Integration Tests
        env:
          DATABASE_URL: postgresql+asyncpg://test_user:test_password@localhost:5432/test_db
          DOCS_USERNAME: admin
          DOCS_PASSWORD: testpassword123
        run: |
          echo "Running integration tests (with database)..."
          pytest tests/integration/ -v --maxfail=5

  # ================================
  # JOB 4: SECURITY TESTS
  # ================================
  # Ejecuta 45+ tests de seguridad (con PostgreSQL)
  # Incluye: CSRF Protection, XSS Prevention, SQL Injection,
  #          Auth Bypass, Rate Limiting
  # OWASP Coverage: A01-A09

  security_tests:
    # 3.12 conserva el nombre exacto (es el que miran los checks obligatorios);
    # 3.14 se prueba sin bloquear, en la misma base de datos de servicio, antes
    # de pasar la imagen de producción a esa versión (Dependabot #423).
    name: 🔐 Security tests ${{ matrix.python-version }}${{ matrix.experimental && ' exp' || '' }}
    runs-on: ubuntu-24.04
    # Columna 2 del gráfico: espera a la de análisis estático (30 sep 2026). Si algo
    # de la columna 1 FALLA, esta se salta: no se gastan minutos de tests en una PR
    # que no se puede mergear. Es seguro porque TODO lo de la columna 1 es check
    # obligatorio en develop y main: un check obligatorio «saltado» cuenta como
    # aprobado en GitHub, pero el fallo de la columna 1 ya bloquea el merge. Lo que
    # solo se salta (API contract o Dependency Review en un push) no cuenta como fallo.
    needs: [linting, type_checking, architecture, api_contract, owasp_semgrep, security_checks, dependency_review, gpg_verification]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') }}
    continue-on-error: ${{ matrix.experimental == true }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12']
        include:
          - python-version: '3.14'
            experimental: true
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Restore pip cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements*.txt') }}

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Wait for PostgreSQL
        run: |
          echo "Waiting for PostgreSQL to be fully ready..."
          sleep 5

      - name: Run Database Migrations
        env:
          DATABASE_URL: postgresql+asyncpg://test_user:test_password@localhost:5432/test_db
        run: |
          echo "Running Alembic migrations..."
          alembic upgrade head

      - name: Run Security Tests
        env:
          DATABASE_URL: postgresql+asyncpg://test_user:test_password@localhost:5432/test_db
          DOCS_USERNAME: admin
          DOCS_PASSWORD: testpassword123
        run: |
          echo "🔐 Running security tests..."
          echo "Tests: CSRF Protection, XSS Prevention, SQL Injection, Auth Bypass"
          pytest tests/security/ -v --maxfail=1 --tb=short

      - name: Security Tests Summary
        if: always()
        run: |
          echo "=========================================="
          echo "🔐 SECURITY TESTS SUMMARY"
          echo "=========================================="
          echo ""
          echo "Tests executed:"
          echo "  - CSRF Protection (11 tests)"
          echo "  - XSS Prevention (13 tests)"
          echo "  - SQL Injection (5 tests)"
          echo "  - Auth Bypass (9 tests)"
          echo "  - Rate Limiting (7 tests)"
          echo ""
          echo "Total: 45+ security tests"
          echo "=========================================="

  # ================================
  # JOB 5: SECURITY CHECKS
  # ================================
  # Ejecuta múltiples herramientas de seguridad

  security_checks:
    name: 🔒 Security Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Descargar todo el historial para Gitleaks

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Restore pip cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements*.txt') }}

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Bandit (Python Security Linter)
        run: |
          echo "🔒 Running Bandit - Python security linter..."
          bandit -r src/ -f json -o bandit-report.json || true
          # Bloquea con cualquier aviso (el 30 sep 2026 quedaba a cero). Un falso
          # positivo se marca con `# nosec <id> - motivo` en la propia línea.
          bandit -r src/ -f screen

      - name: Run pip-audit (PyPA Official Audit)
        id: pip-audit-check
        # Cada herramienta corre aunque falle la anterior: que Bandit se queje no
        # debe esconder una dependencia vulnerable ni un secreto
        if: ${{ !cancelled() }}
        run: |
          # Para aceptar una vulnerabilidad concreta (sin arreglo instalable, por
          # ejemplo): `--ignore-vuln <ID>` en las dos llamadas, con el motivo aquí.
          # El informe JSON lo decide la puerta; el markdown es para leerlo en el log.
          # pip-audit sale con 1 si encuentra algo: quien decide es la puerta, que
          # también falla (con 2) si el informe no llega a escribirse
          pip-audit --format json --output pip-audit-report.json || true
          pip-audit --format markdown || true
          # Cualquier identificador con arreglo bloquea (PYSEC, GHSA, CVE...): hasta el
          # 30 sep 2026 solo contaba «CVE*» y dejaba pasar casi todo
          python .github/scripts/pip_audit_gate.py pip-audit-report.json

      - name: Check for Secrets with Gitleaks
        if: ${{ !cancelled() }}
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_COMMENTS: false
          GITLEAKS_NOTIFY_USER_LIST: ""
        # Bloquea: un secreto en un commit de la PR no entra (antes solo avisaba)

      - name: Generate Security Summary
        if: always()
        run: |
          echo "=========================================="
          echo "🔒 SECURITY CHECKS SUMMARY"
          echo "=========================================="
          echo ""
          echo "📦 Dependency Audit Results:"
          echo "  pip-audit total: ${{ steps.pip-audit-check.outputs.total_vulnerabilities || 'n/a' }}"
          echo "  pip-audit with a fix (blocking): ${{ steps.pip-audit-check.outputs.fixable_vulnerabilities || 'n/a' }}"
          echo "  pip-audit without a fix (warning): ${{ steps.pip-audit-check.outputs.unfixable_vulnerabilities || 'n/a' }}"
          echo ""

          case "${{ steps.pip-audit-check.outcome }}" in
            success) echo "✅ Dependency audit PASSED - No vulnerability with a fix" ;;
            failure) echo "❌ Dependency audit FAILED - See the pip-audit step" ;;
            *) echo "⏭️ Dependency audit did not run" ;;
          esac
          echo "=========================================="

      - name: Upload Security Reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: security-reports
          path: |
            bandit-report.json
            pip-audit-report.json
          retention-days: 30

  # ================================
  # JOB 5: LINTING
  # ================================
  # Verifica calidad de código con Ruff

  linting:
    name: 📝 Lint & format
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Restore pip cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements*.txt') }}

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Ruff Linter
        run: |
          echo "🔍 Running Ruff linter..."
          ruff check src/ tests/ --output-format=github

      - name: Run Ruff Formatter Check
        run: |
          echo "📝 Checking code formatting..."
          ruff format --check src/ tests/

  # ================================
  # JOB 6: TYPE CHECKING
  # ================================
  # Verifica consistencia de tipos con Mypy

  type_checking:
    name: 🔬 Types (mypy)
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Restore pip cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements*.txt') }}

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Mypy Type Checker
        run: |
          echo "🔬 Running Mypy type checker..."
          mypy src/ --show-error-codes --pretty

  # ================================
  # JOB 7: BUILD & CONTAINER SCAN
  # ================================
  # Construye la aplicación Docker + Trivy security scan
  # Solo ejecuta si: unit_tests + integration_tests + security_tests = success
  # Trivy: Escanea vulnerabilidades en imagen Docker (OS + Python packages)

  build:
    name: 🐳 Docker + Trivy
    runs-on: ubuntu-24.04
    # Columna 2 del gráfico: espera a la de análisis estático (30 sep 2026). Si algo
    # de la columna 1 FALLA, esta se salta: no se gastan minutos de tests en una PR
    # que no se puede mergear. Es seguro porque TODO lo de la columna 1 es check
    # obligatorio en develop y main: un check obligatorio «saltado» cuenta como
    # aprobado en GitHub, pero el fallo de la columna 1 ya bloquea el merge. Lo que
    # solo se salta (API contract o Dependency Review en un push) no cuenta como fallo.
    needs: [linting, type_checking, architecture, api_contract, owasp_semgrep, security_checks, dependency_review, gpg_verification]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') }}
    timeout-minutes: 25
    permissions:
      contents: read
      security-events: write  # Subida del SARIF de Trivy
    # La BD de verdad para arrancar como en Render (paso «Start like Render»)
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/Dockerfile
          push: false
          load: true
          tags: rydercupam:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Validate Alembic Migrations Syntax
        run: |
          echo "🔍 Validating Alembic migrations syntax (dry-run)..."

          # Override entrypoint to run only Alembic (skip migrations execution)
          docker run --rm \
            --entrypoint alembic \
            -e DATABASE_URL=postgresql+psycopg2://dummy:dummy@dummy:5432/dummy \
            rydercupam:${{ github.sha }} \
            upgrade head --sql > alembic-output.sql

          if [ $? -eq 0 ]; then
            echo "✅ Alembic migrations syntax is valid"
            echo "📄 Generated SQL (first 20 lines):"
            head -20 alembic-output.sql
          else
            echo "❌ Alembic migrations have syntax errors"
            exit 1
          fi

      # El camino de Render, de principio a fin: entrypoint.sh → alembic upgrade
      # head contra una BD real con una URL SIN driver → uvicorn → /health con la
      # versión. El paso anterior lo saltaba (--entrypoint uvicorn, URL +asyncpg) y
      # la v2.23.0 cayó en Render con todo esto en verde (hotfix 2.23.1). Ver
      # .github/scripts/start-like-render.sh
      - name: Start like Render
        run: |
          VERSION=$(python3 -c 'import runpy; print(runpy.run_path("src/config/version.py")["APP_VERSION"])')
          RED=host bash .github/scripts/start-like-render.sh "rydercupam:${{ github.sha }}" \
            "postgresql://test_user:test_password@localhost:5432/test_db" "$VERSION"

      - name: Run Trivy Container Security Scan
        id: trivy_scan
        # Fijada por commit: una etiqueta de esta acción ya se ha secuestrado antes
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        # Solo informa (pestaña Security); la puerta es el paso de abajo
        continue-on-error: true
        with:
          image-ref: 'rydercupam:${{ github.sha }}'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'HIGH,CRITICAL'
          exit-code: '0'

      - name: Upload Trivy Results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: steps.trivy_scan.outcome == 'success' && hashFiles('trivy-results.sarif') != ''
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Trivy gate (CRITICAL with a fix)
        # Bloquea las CRÍTICAS que ya tienen arreglo (decidido el 30 sep 2026). Las
        # que no lo tienen no se pueden arreglar subiendo nada: siguen en el SARIF
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: 'rydercupam:${{ github.sha }}'
          format: 'table'
          severity: 'CRITICAL'
          ignore-unfixed: true
          # Solo vulnerabilidades: un «secreto» de Trivy en site-packages no debe
          # tumbar el build (los secretos del repo los vigila Gitleaks). Para
          # aceptar una vulnerabilidad concreta, un .trivyignore con el motivo
          scanners: 'vuln'
          exit-code: '1'

      - name: Generate Trivy Summary
        if: always()
        run: |
          echo "=========================================="
          echo "🔍 TRIVY CONTAINER SCAN SUMMARY"
          echo "=========================================="
          echo ""
          echo "Scanned image: rydercupam:${{ github.sha }}"
          echo "Reported (Security tab): HIGH, CRITICAL · Blocking: CRITICAL with a fix"
          echo ""
          echo "Trivy scans for:"
          echo "  - OS package vulnerabilities (apt, apk)"
          echo "  - Python package vulnerabilities"
          echo "  - Known CVEs in base image"
          echo "  - Misconfigurations"
          echo ""
          echo "📊 Results uploaded to GitHub Security tab"
          echo "=========================================="

      - name: Save Docker Image (artifact)
        run: |
          echo "💾 Saving Docker image as artifact..."
          docker save rydercupam:${{ github.sha }} | gzip > rydercupam-image.tar.gz

      - name: Upload Docker Image Artifact
        uses: actions/upload-artifact@v7
        with:
          name: docker-image
          path: rydercupam-image.tar.gz
          retention-days: 7

  # ================================
  # JOB 8: DEPENDENCY REVIEW
  # ================================
  # Sustituye a Snyk (cuota agotada desde hace meses). Solo en PRs: falla si la PR
  # añade o sube una dependencia con una vulnerabilidad conocida, moderada o más,
  # o con una licencia vetada (Snyk también revisaba licencias).
  # Lo que ya está en develop lo vigilan pip-audit (Security Checks) y Dependabot;
  # el código, CodeQL.

  dependency_review:
    name: 🔎 Dependency Review
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Review dependency changes
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: never
          # Lista de PERMITIDAS, no de prohibidas: con deny-licenses (obsoleta) una
          # expresión compuesta como "GPL-3.0 AND GPL-3.0-only" pasaba sin aviso
          # (probado el 28 sep con una PR de prueba). Fuera quedan la GPL y la AGPL:
          # la AGPL obligaría a publicar el código del servicio. La LGPL se admite
          # porque psycopg2 es LGPL-3.0 y usarla desde un servidor no obliga a nada
          # (el frontend sí veta la LGPL-3.0: su código se distribuye al navegador).
          # Solo mira las dependencias de runtime que la PR añade o cambia; una
          # licencia desconocida (NOASSERTION) se informa pero no falla.
          allow-licenses: >-
            MIT, MIT-CMU, MIT-0, Apache-2.0, BSD-2-Clause, BSD-3-Clause, 0BSD, ISC,
            PSF-2.0, Python-2.0, CNRI-Python, MPL-2.0, Unlicense, CC0-1.0, Zlib, HPND,
            BlueOak-1.0.0, LGPL-2.0-only, LGPL-2.0-or-later, LGPL-2.1-only,
            LGPL-2.1-or-later, LGPL-3.0-only, LGPL-3.0-or-later
          # Excepciones, paquete a paquete y con su motivo (una licencia de GitHub que
          # no coincide con la del paquete instalado):
          # - secure: GitHub registra CC-BY-SA-2.5/4.0 AND MIT, por textos del repo;
          #   el paquete que se instala declara MIT (License-Expression y su fichero
          #   LICENSE; deps.dev también dice MIT). Comprobado el 30 sep 2026, #441.
          allow-dependencies-licenses: pkg:pypi/secure

  # ================================
  # JOB 9: SBOM GENERATION
  # ================================
  # Genera Software Bill of Materials (SBOM) en formato CycloneDX
  # Cumple con OWASP A08:2021 Software and Data Integrity Failures
  # Ejecuta solo en main/develop para evitar overhead en feature branches

  sbom_generation:
    name: 📦 SBOM
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write  # Required for GitHub Dependency Graph REST API submission
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || contains(github.ref, 'release/')

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Restore pip cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements*.txt') }}

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install cyclonedx-bom

      - name: Generate SBOM (CycloneDX JSON)
        run: |
          echo "📦 Generating SBOM in CycloneDX format..."
          mkdir -p sbom

          cyclonedx-py requirements requirements.txt -o sbom/sbom.json

      - name: Generate SBOM Metadata
        run: |
          COMPONENT_COUNT=$(jq '.components | length' sbom/sbom.json)
          SBOM_SHA256=$(sha256sum sbom/sbom.json | awk '{print $1}')

          cat > sbom/sbom-metadata.txt << EOF
          SBOM Metadata
          =============
          Generated: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          Format: CycloneDX 1.6 (JSON)
          Source: requirements.txt
          Tool: cyclonedx-py
          Project: Ryder Cup Amateur Manager Backend
          Version: 2.0.0
          Branch: ${{ github.ref_name }}
          Commit: ${{ github.sha }}

          Statistics:
          - Components: $COMPONENT_COUNT
          - SHA256: $SBOM_SHA256

          OWASP Compliance:
          - A08:2021 Software and Data Integrity Failures
          - NIST SP 800-161r1 (Supply Chain Risk Management)
          EOF

      - name: Validate SBOM
        run: |
          echo "🔍 Validating SBOM structure..."

          # Check if SBOM is valid JSON
          jq empty sbom/sbom.json

          # Check required fields
          SPEC_VERSION=$(jq -r '.specVersion' sbom/sbom.json)
          SERIAL_NUMBER=$(jq -r '.serialNumber' sbom/sbom.json)

          echo "✅ SBOM validation passed"
          echo "   Spec version: $SPEC_VERSION"
          echo "   Serial number: $SERIAL_NUMBER"

      - name: Generate SBOM Summary
        run: |
          echo "=========================================="
          echo "📦 SBOM GENERATION SUMMARY"
          echo "=========================================="
          echo ""

          COMPONENT_COUNT=$(jq '.components | length' sbom/sbom.json)
          DIRECT_DEPS=$(grep -E -c "^[[:alnum:]._-]+[[:space:]]*==" requirements.txt || echo "0")
          TRANSITIVE_DEPS=$((COMPONENT_COUNT - DIRECT_DEPS))

          echo "📊 Statistics:"
          echo "   Total components: $COMPONENT_COUNT"
          echo "   Direct dependencies: $DIRECT_DEPS"
          echo "   Transitive dependencies: $TRANSITIVE_DEPS"
          echo ""
          echo "📄 Files generated:"
          echo "   - sbom/sbom.json ($(wc -l < sbom/sbom.json) lines)"
          echo "   - sbom/sbom-metadata.txt"
          echo ""
          echo "🔒 Security:"
          echo "   - Full supply chain visibility"
          echo "   - Vulnerability tracking enabled"
          echo "   - OWASP A08:2021 compliance"
          echo ""
          echo "=========================================="

      - name: Upload SBOM as Artifact
        uses: actions/upload-artifact@v7
        with:
          name: sbom-cyclonedx
          path: |
            sbom/sbom.json
            sbom/sbom-metadata.txt
          retention-days: 90

      - name: Submit SBOM to GitHub Dependency Graph
        if: github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Submit SBOM using GitHub REST API
          bash scripts/submit-sbom-to-github.sh \
            sbom/sbom.json \
            ${{ github.repository_owner }} \
            ${{ github.event.repository.name }} \
            ${{ github.sha }} \
            ${{ github.ref }}

  # ================================
  # JOB 10: GPG SIGNATURE VERIFICATION
  # ================================
  # Verifica que todos los commits estén firmados con GPG
  # Cumple con OWASP A08:2021 Software and Data Integrity Failures
  # Ejecuta en todos los pushes y PRs (security critical)

  gpg_verification:
    name: 🔏 Signed commits
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Fetch full history for commit range verification

      - name: Import GPG Public Key
        env:
          GPG_PUBLIC_KEY: ${{ secrets.GPG_PUBLIC_KEY }}
        run: |
          echo "🔑 Checking GPG public key availability..."

          if [ -n "$GPG_PUBLIC_KEY" ]; then
            echo "✅ GPG_PUBLIC_KEY found, importing..."
            echo "$GPG_PUBLIC_KEY" | gpg --import --batch --yes
          else
            echo "⚠️  GPG_PUBLIC_KEY not available (forked PR or missing secret)"
            echo "   Verification will use system keyring only"
          fi

          echo ""
          echo "📋 Available GPG keys:"
          gpg --list-keys

      - name: Verify Commit Signatures
        env:
          PR_BASE: ${{ github.base_ref }}  # Empty on push events
        run: |
          echo "🔍 Verifying GPG signatures on commits..."
          chmod +x scripts/verify-gpg-signatures.sh

          # For PRs and pushes: verify ONLY commits in THIS specific push event
          # NOT the entire PR history, NOT the entire branch history
          BASE_REF="${{ github.event.before }}"
          HEAD_REF="${{ github.event.after || github.sha }}"

          echo "📋 Signature Verification Scope: CURRENT PUSH ONLY"
          echo "   Commits included: Those added in this specific push event"
          echo "   Base (before push): $BASE_REF"
          echo "   Head (after push): $HEAD_REF"

          # Force push (rebase, amend): "before" is the rewritten commit, which no
          # longer exists in this clone, and the script died with exit 128. Verify
          # every commit the PR adds over its base branch instead: after a rebase
          # all of them are new, not just the last one.
          if [ -n "$BASE_REF" ] && [ "$BASE_REF" != "0000000000000000000000000000000000000000" ] \
             && ! git cat-file -e "${BASE_REF}^{commit}" 2>/dev/null; then
            echo "⚠️  Base $BASE_REF no longer exists (rewritten by a force push)"
            if [ -n "$PR_BASE" ] && MERGE_BASE=$(git merge-base "origin/$PR_BASE" "$HEAD_REF" 2>/dev/null); then
              echo "   Verifying every commit since the merge-base with $PR_BASE: $MERGE_BASE"
              BASE_REF="$MERGE_BASE"
            else
              BASE_REF=""  # Falls through to the initial-push handling below
            fi
          fi

          # Handle initial push or forced push (no previous commit)
          if [ "$BASE_REF" == "0000000000000000000000000000000000000000" ] || [ -z "$BASE_REF" ]; then
            echo "⚠️  Initial/forced push detected"
            # Check if HEAD_REF has a parent commit
            if git rev-parse --verify "${HEAD_REF}^" &>/dev/null; then
              echo "   Verifying only HEAD commit: $HEAD_REF"
              BASE_REF="$HEAD_REF~1"  # Verify only the last commit
            else
              echo "   HEAD_REF is the first commit (no parent)"
              BASE_REF=""  # Empty BASE_REF means verify only HEAD_REF
            fi
          fi

          # Run verification script
          ./scripts/verify-gpg-signatures.sh "$BASE_REF" "$HEAD_REF"

      - name: Generate Verification Summary (Success)
        if: success()
        run: |
          echo "=========================================="
          echo "🔏 GPG SIGNATURE VERIFICATION SUMMARY"
          echo "=========================================="
          echo ""
          echo "✅ All commits in this push/PR are signed with valid GPG keys"
          echo ""
          echo "🔒 Security:"
          echo "   - Code integrity verified"
          echo "   - Author authentication confirmed"
          echo "   - OWASP A08:2021 compliance"
          echo ""
          echo "📖 Policy:"
          echo "   - All commits MUST be signed with GPG"
          echo "   - Branch protection enforces this on main/develop"
          echo ""
          echo "=========================================="

      - name: Generate Verification Summary (Failure)
        if: failure()
        run: |
          echo "=========================================="
          echo "🔏 GPG SIGNATURE VERIFICATION SUMMARY"
          echo "=========================================="
          echo ""
          echo "❌ GPG verification FAILED"
          echo ""
          echo "⚠️  Found unsigned or invalid commits"
          echo ""
          echo "📋 Action Required:"
          echo "   1. Check the 'Verify Commit Signatures' step output above"
          echo "   2. Sign unsigned commits: git rebase --exec 'git commit --amend --no-edit -n -S' origin/main"
          echo "   3. Or amend last commit: git commit --amend --no-edit -S"
          echo "   4. Force push: git push --force"
          echo ""
          echo "📖 Documentation:"
          echo "   See CLAUDE.md section '🔐 Git Commit Signing' for setup instructions"
          echo ""
          echo "=========================================="

  # ================================
  # ARQUITECTURA Y CONTRATO DE LA API
  # ================================
  # Antes en su propio workflow (architecture_and_api_contract.yml): aquí salen en el
  # gráfico del pipeline y en su resumen. Ver .importlinter y la etiqueta api-breaking.

  architecture:
    name: 🏛️ Architecture
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install import-linter
        # La versión sale de requirements-dev.txt, para que local y CI no diverjan
        run: pip install "$(grep -E '^import-linter==' requirements-dev.txt)"

      - name: Check architecture contracts
        run: lint-imports

  api_contract:
    name: 📜 API contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Solo en PRs: compara con la rama base (github.base_ref), que en un push no
    # existe. Al moverlo aquí desde su workflow propio (#434), el push a develop
    # fallaba con `fatal: invalid reference: origin/`.
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read  # leer la etiqueta api-breaking en el momento
    env:
      OASDIFF_VERSION: '1.32.1'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Hace falta la rama base para generar su OpenAPI

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Install oasdiff
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP"
          gh release download "v${OASDIFF_VERSION}" -R oasdiff/oasdiff \
            -p "oasdiff_${OASDIFF_VERSION}_linux_amd64.tar.gz" -p checksums.txt
          grep "oasdiff_${OASDIFF_VERSION}_linux_amd64.tar.gz" checksums.txt | sha256sum -c -
          tar xzf "oasdiff_${OASDIFF_VERSION}_linux_amd64.tar.gz" oasdiff
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Generate OpenAPI (this PR and its base)
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          # La app genera su esquema sin base de datos ni secretos: en el CI no hay .env
          GEN='import json; from main import app; json.dump(app.openapi(), open(__import__("sys").argv[1], "w"), sort_keys=True)'
          python -c "$GEN" "$RUNNER_TEMP/revision.json"
          # La base se genera con las dependencias de la PR. Si la base importa un
          # paquete que la PR ha quitado, este paso falla: es un aviso, no un bug.
          git worktree add --detach "$RUNNER_TEMP/base" "origin/${BASE_REF}"
          (cd "$RUNNER_TEMP/base" && python -c "$GEN" "$RUNNER_TEMP/base.json")

      - name: Check for breaking changes
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set +e
          oasdiff breaking "$RUNNER_TEMP/base.json" "$RUNNER_TEMP/revision.json" --fail-on ERR > report.txt
          CODE=$?
          set -e
          cat report.txt

          {
            echo "## 📜 API contract"
            echo ""
            if [ "$CODE" -eq 0 ]; then
              echo "✅ No breaking changes against \`${{ github.base_ref }}\`."
            else
              echo "❌ Breaking changes against \`${{ github.base_ref }}\`:"
            fi
            echo ""
            echo '```'
            cat report.txt
            echo '```'
            echo ""
            echo "Changelog (all changes, breaking or not):"
            echo '```'
            oasdiff changelog "$RUNNER_TEMP/base.json" "$RUNNER_TEMP/revision.json" || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$CODE" -ne 0 ]; then
            # Las etiquetas de AHORA, no las del evento: al relanzar el job tras
            # poner la etiqueta, el evento sigue siendo el de antes. Solo se
            # preguntan aquí, para que un fallo de la API no tumbe una PR sin
            # cambios incompatibles; si falla, el paso falla (set -e)
            ALLOW_BREAKING=$(gh pr view "$PR_NUMBER" -R "$GITHUB_REPOSITORY" --json labels \
              --jq '[.labels[].name] | index("api-breaking") != null')
            if [ "$ALLOW_BREAKING" = "true" ]; then
              echo "::warning::Breaking API changes accepted by the 'api-breaking' label. Plan both deploys back to back."
              exit 0
            fi
            echo "::error::Breaking API changes. If deliberate, add the 'api-breaking' label, re-run this job and plan the release (backend first, both deploys back to back)."
            exit 1
          fi

  # OWASP Top 10 con Semgrep (p/owasp-top-ten, p/python): SQL construido a mano con
  # text(f"..."), shell=True, eval... Bloquea con cualquier aviso (el 30 sep 2026 el
  # código estaba limpio) y sube el SARIF a la pestaña Security. Complementa a
  # CodeQL y a Bandit.
  owasp_semgrep:
    name: 🛡️ OWASP (Semgrep)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write  # Subida del SARIF a la pestaña Security
    env:
      SEMGREP_VERSION: '1.178.0'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Semgrep
        run: pip install "semgrep==${SEMGREP_VERSION}"

      - name: Scan (OWASP Top 10, Python)
        run: |
          # La regla de Django sobre cursor.execute se excluye: aquí todos los casos de
          # uso se llaman con .execute(request...), y no hay Django. La inyección SQL
          # real con SQLAlchemy (text() con f-strings) la cubre avoid-sqlalchemy-text.
          semgrep scan \
            --config p/owasp-top-ten --config p/python \
            --exclude-rule python.django.security.injection.sql.sql-injection-using-db-cursor-execute.sql-injection-db-cursor-execute \
            --metrics off --error \
            --sarif-output=semgrep.sarif \
            src main.py

      - name: Upload results to the Security tab
        if: always() && hashFiles('semgrep.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  # ================================
  # JOB 11: SUMMARY
  # ================================
  # Job final que depende de todos los anteriores

  pipeline_summary:
    name: 📊 Summary
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [unit_tests, integration_tests, security_tests, security_checks, linting, type_checking, build, dependency_review, sbom_generation, gpg_verification, architecture, api_contract, owasp_semgrep]
    if: always()

    steps:
      - name: Generate Pipeline Summary
        env:
          COMMIT_MSG_INPUT: ${{ github.event.head_commit.message || github.event.pull_request.title || 'N/A' }}
        run: |
          # Function to get emoji for job result
          get_emoji() {
            case "$1" in
              success) echo "✅" ;;
              failure) echo "❌" ;;
              skipped) echo "⏭️" ;;
              cancelled) echo "🚫" ;;
              *) echo "❓" ;;
            esac
          }

          # Function to get status badge
          get_badge() {
            case "$1" in
              success) echo "![success](https://img.shields.io/badge/status-success-brightgreen)" ;;
              failure) echo "![failure](https://img.shields.io/badge/status-failure-red)" ;;
              skipped) echo "![skipped](https://img.shields.io/badge/status-skipped-yellow)" ;;
              *) echo "![unknown](https://img.shields.io/badge/status-unknown-lightgrey)" ;;
            esac
          }

          # Collect results
          UNIT_TESTS="${{ needs.unit_tests.result }}"
          INTEGRATION_TESTS="${{ needs.integration_tests.result }}"
          SECURITY_TESTS="${{ needs.security_tests.result }}"
          SECURITY_CHECKS="${{ needs.security_checks.result }}"
          DEPENDENCY_REVIEW="${{ needs.dependency_review.result }}"
          SBOM_GEN="${{ needs.sbom_generation.result }}"
          GPG_VERIFY="${{ needs.gpg_verification.result }}"
          LINTING="${{ needs.linting.result }}"
          TYPE_CHECKING="${{ needs.type_checking.result }}"
          BUILD="${{ needs.build.result }}"
          ARCHITECTURE="${{ needs.architecture.result }}"
          API_CONTRACT="${{ needs.api_contract.result }}"
          OWASP="${{ needs.owasp_semgrep.result }}"

          # Calculate metrics
          # Note: TOTAL_JOBS counts functional jobs (excludes the summary)
          TOTAL_JOBS=13
          SUCCESS_COUNT=$(echo "$UNIT_TESTS $INTEGRATION_TESTS $SECURITY_TESTS $SECURITY_CHECKS $DEPENDENCY_REVIEW $SBOM_GEN $GPG_VERIFY $LINTING $TYPE_CHECKING $BUILD $ARCHITECTURE $API_CONTRACT $OWASP" | grep -o "success" | wc -l)
          FAILURE_COUNT=$(echo "$UNIT_TESTS $INTEGRATION_TESTS $SECURITY_TESTS $SECURITY_CHECKS $DEPENDENCY_REVIEW $SBOM_GEN $GPG_VERIFY $LINTING $TYPE_CHECKING $BUILD $ARCHITECTURE $API_CONTRACT $OWASP" | grep -o "failure" | wc -l)
          SKIPPED_COUNT=$(echo "$UNIT_TESTS $INTEGRATION_TESTS $SECURITY_TESTS $SECURITY_CHECKS $DEPENDENCY_REVIEW $SBOM_GEN $GPG_VERIFY $LINTING $TYPE_CHECKING $BUILD $ARCHITECTURE $API_CONTRACT $OWASP" | grep -o "skipped" | wc -l)

          # Sanitize commit message for markdown table
          # COMMIT_MSG_INPUT is passed via env: block to avoid bash injection from multiline messages
          if [ -z "$COMMIT_MSG_INPUT" ]; then
            SANITIZED_COMMIT_MSG="N/A"
          else
            # Extract only first line (title) and escape pipe chars for markdown table
            SANITIZED_COMMIT_MSG=$(echo "$COMMIT_MSG_INPUT" | head -n 1 | sed 's/|/\\|/g')
          fi

          # Calculate percentages using python (guaranteed available in GitHub Actions)
          SUCCESS_PERCENT=$(python3 -c "print(f'{($SUCCESS_COUNT * 100) / $TOTAL_JOBS:.1f}')")
          FAILURE_PERCENT=$(python3 -c "print(f'{($FAILURE_COUNT * 100) / $TOTAL_JOBS:.1f}')")
          SKIPPED_PERCENT=$(python3 -c "print(f'{($SKIPPED_COUNT * 100) / $TOTAL_JOBS:.1f}')")

          # Generate Markdown Summary
          {
            echo "# 🏆 CI/CD Pipeline Execution Report"
            echo ""
            echo "## 📋 Pipeline Metadata"
            echo ""
            echo "| Property | Value |"
            echo "|----------|-------|"
            echo "| **Branch** | \`${{ github.ref_name }}\` |"
            echo "| **Commit** | [\`${GITHUB_SHA:0:7}\`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}) |"
            echo "| **Commit Message** | $SANITIZED_COMMIT_MSG |"
            echo "| **Triggered by** | @${{ github.actor }} |"
            echo "| **Event** | \`${{ github.event_name }}\` |"
            echo "| **Run Number** | #${{ github.run_number }} |"
            echo "| **Workflow** | [\`${{ github.workflow }}\`](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |"
            echo ""
            echo "---"
            echo ""
            echo "## 📊 Job Execution Results"
            echo ""
            echo "| Category | Job | Status | Details |"
            echo "|----------|-----|--------|---------|"
            echo "| **🧪 Testing** | Unit Tests (Python 3.11/3.12) | $(get_emoji "$UNIT_TESTS") | ~900+ tests, ~45s |"
            echo "| **🧪 Testing** | Integration Tests | $(get_emoji "$INTEGRATION_TESTS") | ~72+ tests, PostgreSQL |"
            echo "| **🧪 Testing** | Security Tests | $(get_emoji "$SECURITY_TESTS") | CSRF, XSS, SQLi, Auth |"
            echo "| **🛡️ Security** | OWASP Top 10 (Semgrep) | $(get_emoji "$OWASP") | owasp-top-ten + python rules |"
            echo "| **🔒 Security** | Security Checks | $(get_emoji "$SECURITY_CHECKS") | Bandit, pip-audit, Gitleaks |"
            echo "| **🔒 Security** | Dependency Review | $(get_emoji "$DEPENDENCY_REVIEW") | PRs: no vulnerable dependency added |"
            echo "| **🔒 Security** | GPG Verification | $(get_emoji "$GPG_VERIFY") | Commit signatures |"
            echo "| **📦 Supply Chain** | SBOM Generation | $(get_emoji "$SBOM_GEN") | CycloneDX 1.6 |"
            echo "| **🏛️ Architecture** | Architecture Contracts | $(get_emoji "$ARCHITECTURE") | Layers, pure domain, no foreign infrastructure |"
            echo "| **🏛️ Architecture** | API Contract | $(get_emoji "$API_CONTRACT") | No breaking change (or labelled api-breaking) |"
            echo "| **📝 Quality** | Code Linting | $(get_emoji "$LINTING") | Ruff checks and format |"
            echo "| **📝 Quality** | Type Checking | $(get_emoji "$TYPE_CHECKING") | Mypy analysis |"
            echo "| **🐳 Build** | Docker Build & Scan | $(get_emoji "$BUILD") | Trivy scan |"
            echo ""
            echo "---"
            echo ""
            echo "## 📈 Pipeline Statistics"
            echo ""
            echo "| Metric | Count | Percentage |"
            echo "|--------|-------|------------|"
            echo "| ✅ **Successful Jobs** | $SUCCESS_COUNT | ${SUCCESS_PERCENT}% |"
            echo "| ❌ **Failed Jobs** | $FAILURE_COUNT | ${FAILURE_PERCENT}% |"
            echo "| ⏭️ **Skipped Jobs** | $SKIPPED_COUNT | ${SKIPPED_PERCENT}% |"
            echo "| 🎯 **Total Jobs** | $TOTAL_JOBS | 100% |"
            echo ""
          } >> $GITHUB_STEP_SUMMARY

          # Determine overall status
          # Todo lo obligatorio cuenta, y un cancelado no es un aprobado
          no_paso() { [ "$1" == "failure" ] || [ "$1" == "cancelled" ]; }
          if no_paso "$UNIT_TESTS" || no_paso "$INTEGRATION_TESTS" || no_paso "$SECURITY_TESTS" || no_paso "$GPG_VERIFY" || no_paso "$ARCHITECTURE" || no_paso "$API_CONTRACT" || no_paso "$OWASP" || no_paso "$LINTING" || no_paso "$TYPE_CHECKING" || no_paso "$SECURITY_CHECKS" || no_paso "$DEPENDENCY_REVIEW"; then
            {
              echo "---"
              echo ""
              echo "## ❌ Pipeline Status: **FAILED**"
              echo ""
              echo "![Status](https://img.shields.io/badge/pipeline-FAILED-red?style=for-the-badge)"
              echo ""
              echo "### 🚨 Critical Tests Failed"
              echo ""
              echo "The following critical test suites did not pass:"
              echo ""
              no_paso "$UNIT_TESTS" && echo "- ❌ **Unit Tests** — Core business logic validation failed"
              no_paso "$INTEGRATION_TESTS" && echo "- ❌ **Integration Tests** — Database/API integration issues detected"
              no_paso "$SECURITY_TESTS" && echo "- ❌ **Security Tests** — Security vulnerabilities found (CSRF, XSS, SQLi, Auth)"
              no_paso "$GPG_VERIFY" && echo "- ❌ **GPG Verification** — Unsigned or invalid commit signatures detected"
              no_paso "$ARCHITECTURE" && echo "- ❌ **Architecture Contracts** — An import breaks a layer rule (see .importlinter)"
              no_paso "$API_CONTRACT" && echo "- ❌ **API Contract** — A breaking API change without the api-breaking label, or the comparison could not run (see the job log)"
              no_paso "$OWASP" && echo "- ❌ **OWASP Top 10 (Semgrep)** — Security finding in the code (see the Security tab)"
              no_paso "$LINTING" && echo "- ❌ **Lint & format** — Ruff (\`ruff check src/ tests/\`, \`ruff format --check\`)"
              no_paso "$TYPE_CHECKING" && echo "- ❌ **Types** — mypy"
              no_paso "$SECURITY_CHECKS" && echo "- ❌ **Security Checks** — Bandit, pip-audit (a vulnerability with a fix) or Gitleaks"
              no_paso "$DEPENDENCY_REVIEW" && echo "- ❌ **Dependency Review** — A new dependency with a vulnerability or a license outside the allow-list"
              echo ""
              echo "### 📋 Action Required"
              echo ""
              echo "1. 🔍 **Review Failed Tests**: Click on the failed job(s) above to see detailed logs"
              echo "2. 🐛 **Fix Issues Locally**: Run tests locally with \`pytest tests/\`"
              echo "3. ✅ **Verify Fixes**: Ensure all tests pass before pushing"
              echo "4. 🔄 **Push Changes**: Git commit and push to re-trigger pipeline"
              echo ""
              echo "> ⚠️ **Warning**: This PR cannot be merged until all tests pass."
              echo ""
              echo "### 📚 Helpful Resources"
              echo ""
              echo "- [Testing Guide](../docs/TESTING.md)"
              echo "- [Troubleshooting](../docs/TROUBLESHOOTING.md)"
              echo "- [CI/CD Pipeline Docs](../docs/ci-cd/PIPELINE_GUIDE.md)"
            } >> $GITHUB_STEP_SUMMARY
            exit 1
          elif [ "$BUILD" == "failure" ]; then
            {
              echo "---"
              echo ""
              echo "## ❌ Pipeline Status: **FAILED**"
              echo ""
              echo "![Status](https://img.shields.io/badge/pipeline-FAILED-red?style=for-the-badge)"
              echo ""
              echo "### 🐳 Docker Build Failed"
              echo ""
              echo "The Docker image build or security scan failed."
              echo ""
              echo "**Common Causes:**"
              echo "- ❌ Dockerfile syntax errors"
              echo "- ❌ Missing dependencies in requirements.txt"
              echo "- ❌ Trivy detected a CRITICAL vulnerability with a fix"
              echo "- ❌ Alembic migrations validation failed"
              echo ""
              echo "### 📋 Action Required"
              echo ""
              echo "1. 🔍 **Check Build Logs**: Review the 'Build Docker' job logs"
              echo "2. 🐳 **Test Locally**: Run \`docker-compose up --build\` to reproduce"
              echo "3. 🔒 **Check Trivy Results**: Review vulnerability scan output"
              echo "4. 🔄 **Push Fix**: Commit changes and re-trigger pipeline"
            } >> $GITHUB_STEP_SUMMARY
            exit 1
          elif [ "$BUILD" == "skipped" ] || [ "$BUILD" == "cancelled" ]; then
            # Tests y build solo se saltan si algo de la primera columna no pasó:
            # sin ellos no hay nada que dar por bueno
            {
              echo "---"
              echo ""
              echo "## ❌ Pipeline Status: **FAILED**"
              echo ""
              echo "![Status](https://img.shields.io/badge/pipeline-FAILED-red?style=for-the-badge)"
              echo ""
              echo "### ⏭️ Tests and build did not run"
              echo ""
              echo "They were skipped or cancelled: the run was cancelled, or a check in the first column did not finish."
              echo ""
              echo "### 📋 Action Required"
              echo ""
              echo "1. 🔍 **Fix Code Quality**: Run \`ruff check src/ tests/\` locally"
              echo "2. 📝 **Fix Type Errors**: Run \`mypy src/\` locally"
              echo "3. 🔒 **Update Dependencies**: Check the \`pip-audit\` report"
              echo "4. ✅ **Verify Locally**: Ensure all checks pass before pushing"
              echo ""
              echo "> ⚠️ **Note**: Tests and build run again once the first column passes."
            } >> $GITHUB_STEP_SUMMARY
            exit 1
          else
            {
              echo "---"
              echo ""
              echo "## ✅ Pipeline Status: **SUCCESS**"
              echo ""
              echo "![Status](https://img.shields.io/badge/pipeline-SUCCESS-brightgreen?style=for-the-badge)"
              echo ""
              echo "### 🎉 All Checks Passed!"
              echo ""
              echo "**Test Coverage:**"
              echo "- ✅ **900+ Unit Tests** — All business logic validated"
              echo "- ✅ **72+ Integration Tests** — Database & API working correctly"
              echo "- ✅ **45+ Security Tests** — No vulnerabilities detected"
              echo ""
              echo "**Code Quality:**"
              echo "- ✅ **Linting** — Code style compliant (Ruff)"
              echo "- ✅ **Type Checking** — Full type safety (Mypy)"
              echo "- ✅ **GPG Signatures** — All commits properly signed"
              echo ""
              echo "**Security Scans:**"
              echo "- ✅ **Dependency Audit** — No critical CVEs (pip-audit)"
              echo "- ✅ **Code Analysis** — Clean SAST scan (CodeQL)"
              echo "- ✅ **Container Scan** — No CRITICAL vulnerability with a fix (Trivy)"
              echo "- ✅ **SBOM Generated** — Supply chain transparency (CycloneDX)"
              echo ""
              echo "---"
              echo ""
              echo "### 🚀 Deployment Ready"
              echo ""
              echo "**Docker Image:**"
              echo "- 📦 **Tag**: \`rydercupam:${GITHUB_SHA:0:7}\`"
              echo "- 🐳 **Size**: Optimized multi-stage build"
              echo "- 🔒 **Scanned**: Trivy security validation passed"
              echo ""
              echo "**Next Steps (GitFlow):**"
              echo "1. ✅ **Merge this PR to \`develop\`** — Integration branch for features"
              echo "2. 🚀 **Auto-deploy to staging** — Staging environment (Render/K8s)"
              echo "3. 🧪 **Run integration tests** — Validate on staging environment"
              echo "4. 📊 **Monitor staging metrics** — Check logs, performance, errors"
              echo "5. 🎯 **When ready for release** — Create PR from \`develop\` → \`main\`"
              echo "6. 🚢 **Deploy to production** — After \`main\` merge + approval"
              echo ""
              echo "> **Note**: Feature branches → \`develop\` → \`main\` (GitFlow workflow)"
              echo ""
              echo "### 📊 Quality Metrics"
              echo ""
              echo "| Metric | Score |"
              echo "|--------|-------|"
              echo "| Test Pass Rate | 100% ✅ |"
              echo "| Code Coverage | >90% ✅ |"
              echo "| Security Score | 10/10 ✅ |"
              echo "| Type Safety | 100% ✅ |"
              echo ""
              echo "---"
              echo ""
              echo "*Pipeline completed in ~3 minutes (10 functional jobs, 12 total)* ⚡"
            } >> $GITHUB_STEP_SUMMARY
            exit 0
          fi
