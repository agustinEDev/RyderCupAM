name: "🟣 Feature"
description: "Nueva funcionalidad o mejora"
title: "[Feature]: "
labels: ["type:feature"]
body:
  - type: textarea
    id: description
    attributes:
      label: Descripción
      description: ¿Qué se quiere construir y por qué?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Criterios de aceptación
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Prioridad
      description: Añade también la label priority:P0/P1/P2 correspondiente
      options:
        - P0 — Crítico
        - P1 — Alto
        - P2 — Normal
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Contexto adicional
    validations:
      required: false
