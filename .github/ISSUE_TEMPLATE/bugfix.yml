name: "🔴 Bug"
description: "Algo no funciona como debería"
title: "[Bug]: "
labels: ["type:bugfix"]
body:
  - type: textarea
    id: description
    attributes:
      label: Descripción del bug
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Pasos para reproducir
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Comportamiento esperado
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Comportamiento actual
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Entorno
      placeholder: "Python 3.11 / Docker local / develop branch..."
    validations:
      required: false
  - type: dropdown
    id: priority
    attributes:
      label: Prioridad
      description: Añade también la label priority:P0/P1/P2 correspondiente
      options:
        - P0 — Crítico
        - P1 — Alto
        - P2 — Normal
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Contexto adicional (logs, stacktrace...)
    validations:
      required: false
