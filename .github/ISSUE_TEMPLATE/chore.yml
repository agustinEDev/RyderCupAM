name: "✅ Chore"
description: "Mantenimiento, tooling, dependencias, configuración"
title: "[Chore]: "
labels: ["type:chore"]
body:
  - type: textarea
    id: description
    attributes:
      label: Descripción
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Prioridad
      description: Añade también la label priority:P0/P1/P2 correspondiente
      options:
        - P0 — Crítico
        - P1 — Alto
        - P2 — Normal
    validations:
      required: true
