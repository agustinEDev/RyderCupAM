# ================================
# CONFIGURACIÓN DE MYPY
# ================================
# Mypy es un verificador estático de tipos para Python.
# Analiza el código usando type hints para detectar errores antes de runtime.

[mypy]
# Pydantic entiende los DTO (campos con valor por defecto, alias) y, con init_typed,
# sigue comprobando los tipos de los argumentos al construirlos
plugins = pydantic.mypy
# Versión de Python
python_version = 3.12

# Directorios a analizar
files = src/

# Directorios a excluir (regex pattern)
exclude = ^(alembic/versions/|tests/|\.venv/)

# ================================
# CONFIGURACIÓN GENERAL
# ================================

# Modo estricto (activa muchas validaciones)
# warn_return_any = True
# warn_unused_configs = True

# Permite funciones sin type hints (gradual typing)
disallow_untyped_defs = False
# Las funciones sin anotar también se comprueban por dentro (fase 5, paso 1 de mypy estricto)
check_untyped_defs = True
disallow_any_unimported = False
disallow_any_expr = False
disallow_any_decorated = False
disallow_any_explicit = False
disallow_any_generics = False
disallow_subclassing_any = False

# Advertencias
warn_redundant_casts = True
warn_unused_ignores = True
warn_no_return = True
warn_unreachable = True

# Imports - Ignorar librerías sin type stubs
ignore_missing_imports = True
follow_imports = normal

# Cache y reportes
incremental = True
cache_dir = .mypy_cache
show_error_codes = True
show_column_numbers = True
pretty = True

# ================================
# CONFIGURACIÓN POR MÓDULO
# ================================

# Application layer - Use cases with business logic
# La aplicación, estricta y sin exenciones (fase 5, paso 3 de mypy estricto)
[mypy-src.modules.*.application.*]
disallow_untyped_defs = True
disallow_incomplete_defs = True
disallow_any_generics = True
disallow_untyped_calls = True
warn_return_any = True

# Rutas, persistencia, configuración, correo y log: comprobados sin exenciones (fase 5,
# paso 4 de mypy estricto). La única que queda es la de abajo, la del mapeo imperativo

# Repositorios SQLAlchemy - el mapeo imperativo. `map_imperatively` añade a la clase
# del dominio sus columnas y relaciones en tiempo de ejecución, y mypy solo ve la
# entidad: `Competition._status_value` no existe para él (attr-defined),
# `Enrollment._user_id` es un atributo de instancia leído en la clase (misc) y
# `User._email == x` es un bool y no una expresión SQL (arg-type en where/and_,
# joinedload, order_by). Hacerlo visible a mypy obligaría a reescribir cada consulta
# con las columnas de la tabla o a meter SQLAlchemy en el dominio. Solo estos
# módulos, cada uno con los códigos que de verdad necesita: un repositorio nuevo se
# comprueba entero hasta que se añada aquí a propósito
[mypy-src.modules.competition.infrastructure.persistence.sqlalchemy.competition_repository,src.modules.competition.infrastructure.persistence.sqlalchemy.draft_repository,src.modules.competition.infrastructure.persistence.sqlalchemy.enrollment_repository,src.modules.competition.infrastructure.persistence.sqlalchemy.hole_score_repository,src.modules.competition.infrastructure.persistence.sqlalchemy.invitation_repository,src.modules.competition.infrastructure.persistence.sqlalchemy.match_repository,src.modules.competition.infrastructure.persistence.sqlalchemy.round_repository,src.modules.competition.infrastructure.persistence.sqlalchemy.team_assignment_repository,src.modules.quick_match.infrastructure.persistence.sqlalchemy.quick_match_hole_score_repository,src.modules.quick_match.infrastructure.persistence.sqlalchemy.quick_match_repository,src.modules.social.infrastructure.persistence.sqlalchemy.activity_event_repository,src.modules.social.infrastructure.persistence.sqlalchemy.friendship_repository,src.modules.user.infrastructure.persistence.sqlalchemy.user_device_repository,src.modules.user.infrastructure.persistence.sqlalchemy.user_repository,src.shared.infrastructure.persistence.sqlalchemy.country_repository]
disable_error_code = misc, attr-defined, arg-type

# Los mismos, sin columnas privadas que no existan para mypy
[mypy-src.modules.competition.infrastructure.persistence.sqlalchemy.envelope_repository,src.modules.golf_course.infrastructure.persistence.repositories.golf_course_repository]
disable_error_code = misc, arg-type

# El dominio, estricto y sin exenciones (fase 5, paso 2 de mypy estricto). Cubre también
# entidades y eventos: no añadir secciones más específicas, que mandarían sobre esta
[mypy-src.modules.*.domain.*]
disallow_untyped_defs = True
disallow_incomplete_defs = True
disallow_any_generics = True
disallow_untyped_calls = True
warn_return_any = True


# Shared domain, estricto y sin exenciones (fase 5, paso 2)
[mypy-src.shared.domain.*]
disallow_untyped_defs = True
disallow_incomplete_defs = True
disallow_any_generics = True
disallow_untyped_calls = True
warn_return_any = True

# Alembic - migraciones con imports dinámicos
[mypy-alembic.*]
ignore_errors = True

# Tests - permitir más flexibilidad
[mypy-tests.*]
disallow_untyped_defs = False
disable_error_code = arg-type, no-untyped-call

# ================================
# THIRD-PARTY LIBRARIES SIN STUBS
# ================================

[mypy-passlib.*]
ignore_missing_imports = True

[mypy-jose.*]
ignore_missing_imports = True

[mypy-bcrypt.*]
ignore_missing_imports = True

[mypy-asyncpg.*]
ignore_missing_imports = True

[mypy-requests.*]
ignore_missing_imports = True

[mypy-yaml.*]
ignore_missing_imports = True

[mypy-uvicorn.*]
ignore_missing_imports = True

[mypy-mailgun.*]
ignore_missing_imports = True

[pydantic-mypy]
init_typed = True
init_forbid_extra = True
warn_required_dynamic_aliases = True
